<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشکر و قدردانی</title>
  
  <style>
    /* تعریف فونت سفارشی */
    @font-face {
      font-family: 'JioFont';
      src: url('font/jio.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'JioFont', Tahoma, sans-serif;
      /* بک‌گراند مشکی گرادیانت عمیق و زیبا */
      background: radial-gradient(circle at center, #1a1a24 0%, #0d0d11 50%, #050507 100%);
      overflow: hidden;
      padding: 20px;
    }

    /* باکس شیشه‌ای (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 30px 45px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      max-width: 90%;
      animation: float 4s ease-in-out infinite alternate;
    }

    /* متن */
    .card-text {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    /* آیکون قلب */
    .heart-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      /* انیمیشن تپش زنده و ارگانیک قلب */
      animation: heartbeat 1.25s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      /* هاله نورانی دور قلب متناسب با گرادیانت */
      filter: drop-shadow(0 0 12px rgba(235, 33, 110, 0.6));
    }

    /* تعریف تپش قلب (دو ضربان شبیه قلب واقعی) */
    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }
      14% {
        transform: scale(1.22);
      }
      28% {
        transform: scale(1.05);
      }
      42% {
        transform: scale(1.28);
      }
      70% {
        transform: scale(1);
      }
      100% {
        transform: scale(1);
      }
    }

    /* شناوری ملایم کل باکس */
    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-8px);
      }
    }

    /* بهینه‌سازی برای گوشی و صفحات کوچک‌تر */
    @media (max-width: 600px) {
      .glass-card {
        padding: 22px 28px;
        gap: 12px;
      }
      .card-text {
        font-size: 1.25rem;
      }
      .heart-icon {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <span class="card-text">مرسی که همراه ما بودید</span>

    <!-- آیکون قلب وکتور با گرادیانت داخلی قرمز و بنفش -->
    <svg class="heart-icon" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff2a6d" />
          <stop offset="50%" stop-color="#d6249f" />
          <stop offset="100%" stop-color="#8a2be2" />
        </linearGradient>
      </defs>
      <path fill="url(#heartGradient)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>

</body>
</html>
