<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حذف هوشمند پس‌زمینه تصویر</title>
    <!-- استایل‌ها -->
    <style>
        :root {
            --bg-main: #0c0d11;
            --card-bg: rgba(22, 24, 31, 0.75);
            --border-gold: rgba(212, 175, 55, 0.35);
            --border-gold-bright: #e6ca65;
            --gold-accent: #d4af37;
            --text-main: #f0f2f5;
            --text-muted: #9ba1b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.08);
            text-align: center;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--border-gold-bright);
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* ناحیه آپلود */
        .dropzone {
            border: 2px dashed var(--border-gold);
            border-radius: 14px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--border-gold-bright);
            background: rgba(212, 175, 55, 0.04);
            transform: translateY(-2px);
        }

        .dropzone svg {
            width: 48px;
            height: 48px;
            stroke: var(--gold-accent);
            margin-bottom: 12px;
        }

        .dropzone p {
            font-size: 15px;
            color: var(--text-main);
        }

        .dropzone span {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-top: 6px;
        }

        input[type="file"] {
            display: none;
        }

        /* لودینگ */
        .loading-box {
            display: none;
            margin: 28px 0;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(212, 175, 55, 0.15);
            border-top: 3px solid var(--border-gold-bright);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .progress-text {
            font-size: 14px;
            color: var(--border-gold-bright);
        }

        /* نمایش نتیجه */
        .result-container {
            display: none;
            margin-top: 28px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .preview-card span {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .img-wrapper {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            /* پترن شطرنجی برای نمایش ترنسپرنت */
            background-color: #14151b;
            background-image: 
                linear-gradient(45deg, #1f222e 25%, transparent 25%), 
                linear-gradient(-45deg, #1f222e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1f222e 75%), 
                linear-gradient(-45deg, transparent 75%, #1f222e 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* دکمه‌های دانلود */
        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f3db7a 0%, #d4af37 100%);
            color: #0b0c10;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-gold);
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: none;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 16px;
            display: inline-block;
            font-size: 13px;
        }
        
        .btn-reset:hover {
            color: #fff;
        }
    </style>

    <!-- لود کتابخانه کم‌حجم و پیشرفته هوش مصنوعی حذف پس‌زمینه درون مرورگر -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>حذف هوشمند <span>پس‌زمینه عکس</span></h1>
            <p>پردازش کاملاً امن و محلی درون مرورگر با هوش مصنوعی بدون افت کیفیت</p>
        </header>

        <!-- باکس درگ اند دراپ -->
        <div class="dropzone" id="dropzone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p>عکس خود را اینجا بکشید یا برای انتخاب کلیک کنید</p>
            <span>پشتیبانی از فرمت‌های JPG ،PNG و WEBP</span>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- لودینگ -->
        <div class="loading-box" id="loadingBox">
            <div class="spinner"></div>
            <p class="progress-text" id="progressText">در حال پردازش هوشمند تصویر...</p>
        </div>

        <!-- بخش نمایش نتیجه و دکمه‌های دانلود -->
        <div class="result-container" id="resultContainer">
            <div class="preview-grid">
                <div class="preview-card">
                    <span>تصویر اولیه</span>
                    <div class="img-wrapper">
                        <img id="originalPreview" alt="تصویر اصلی">
                    </div>
                </div>
                <div class="preview-card">
                    <span>نتیجه بدون پس‌زمینه</span>
                    <div class="img-wrapper">
                        <img id="resultImage" alt="خروجی بدون پس‌زمینه">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-gold" id="btnDownloadHD">
                    دانلود با کیفیت اصلی (HD PNG)
                </button>
                <button class="btn btn-secondary" id="btnDownloadLow">
                    دانلود نسخه کم‌حجم (وب)
                </button>
            </div>
            <button class="btn-reset" id="btnReset">پردازش یک عکس دیگر</button>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const loadingBox = document.getElementById('loadingBox');
        const progressText = document.getElementById('progressText');
        const resultContainer = document.getElementById('resultContainer');
        const originalPreview = document.getElementById('originalPreview');
        const resultImage = document.getElementById('resultImage');
        const btnDownloadHD = document.getElementById('btnDownloadHD');
        const btnDownloadLow = document.getElementById('btnDownloadLow');
        const btnReset = document.getElementById('btnReset');

        let originalFile = null;
        let hdResultBlob = null;

        // کنترل درگ و دراپ
        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleImage(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImage(e.target.files[0]);
            }
        });

        // پردازش هوش مصنوعی
        async function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('لطفاً یک فایل تصویری معتبر انتخاب کنید.');
                return;
            }

            originalFile = file;
            originalPreview.src = URL.createObjectURL(file);

            // بروزرسانی UI
            dropzone.style.display = 'none';
            resultContainer.style.display = 'none';
            loadingBox.style.display = 'block';
            progressText.innerText = 'در حال بارگذاری مدل هوش مصنوعی و تفکیک لبه‌ها...';

            try {
                // اجرای حذف پس‌زمینه با @imgly/background-removal
                hdResultBlob = await imglyRemoveBackground(file, {
                    progress: (key, current, total) => {
                        const percent = Math.round((current / total) * 100);
                        if (!isNaN(percent)) {
                            progressText.innerText = `در حال پردازش: ${percent}%`;
                        }
                    }
                });

                const resultUrl = URL.createObjectURL(hdResultBlob);
                resultImage.src = resultUrl;

                loadingBox.style.display = 'none';
                resultContainer.style.display = 'block';
            } catch (error) {
                console.error(error);
                alert('خطایی در پردازش تصویر رخ داد. مطمئن شوید مرورگر شما به‌روز است.');
                resetUI();
            }
        }

        // دانلود نسخه اصلی (HD)
        btnDownloadHD.addEventListener('click', () => {
            if (!hdResultBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(hdResultBlob);
            a.download = `removed-bg-HD-${Date.now()}.png`;
            a.click();
        });

        // ساخت و دانلود نسخه بهینه / کیفیت پایین (مقیاس ۸۰۰ پیکسل و فشرده‌سازی)
        btnDownloadLow.addEventListener('click', () => {
            if (!hdResultBlob) return;

            const img = new Image();
            img.src = URL.createObjectURL(hdResultBlob);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // تعیین اندازه کوچک‌تر (حداکثر عرض یا ارتفاع ۸۰۰ پیکسل)
                const maxDim = 800;
                let width = img.width;
                let height = img.height;

                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                // تبدیل به WebP با ترنسپرنسی و کیفیت بهینه برای کاهش چشمگیر حجم
                canvas.toBlob((blob) => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `removed-bg-optimized-${Date.now()}.webp`;
                    a.click();
                }, 'image/webp', 0.8);
            };
        });

        // ریست برای عکس جدید
        btnReset.addEventListener('click', resetUI);

        function resetUI() {
            fileInput.value = '';
            originalFile = null;
            hdResultBlob = null;
            loadingBox.style.display = 'none';
            resultContainer.style.display = 'none';
            dropzone.style.display = 'block';
        }
    </script>
</body>
</html>
